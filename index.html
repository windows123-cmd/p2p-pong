<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>P2P Pong</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #0a0a0a; color: #eee;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: system-ui, monospace;
    }
    canvas { display: block; border-radius: 8px; box-shadow: 0 0 40px rgba(255,255,255,0.05); }
    #status { margin-top: 14px; font-size: 13px; color: #888; text-align: center; }
    a { color: #5599ff; }
  </style>
</head>
<body>
  <canvas id="c" width="800" height="500"></canvas>
  <div id="status">Connecting…</div>
  <script type="module">
    import { joinRoom as trysteroJoin } from 'https://esm.run/@trystero-p2p/mqtt';

    const APP_ID = 'p2p-pong-windows123-cmd';
    const GAME_SUFFIX = '-game';
    const W = 800, H = 500;
    const PADDLE_W = 12, PADDLE_H = 80, PADDLE_SPEED = 6, BALL_R = 8;
    const TICK_MS = 1000 / 60;
    const STATE_HZ = 30;

    const params = new URLSearchParams(location.search);
    const roomCode = params.get('room');
    const role = params.get('role');

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    if (!roomCode || !role) {
      statusEl.innerHTML = 'Missing room/role. <a href="lobby.html">Back to lobby</a>';
      throw new Error('no params');
    }

    function clampPaddle(y) { return Math.max(PADDLE_H/2, Math.min(H - PADDLE_H/2, y)); }

    function draw(s) {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#333';
      ctx.setLineDash([8, 12]);
      ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ff5555';
      ctx.fillRect(20, s.paddles[0].y - PADDLE_H/2, PADDLE_W, PADDLE_H);
      ctx.fillStyle = '#5599ff';
      ctx.fillRect(W - 20 - PADDLE_W, s.paddles[1].y - PADDLE_H/2, PADDLE_W, PADDLE_H);
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(s.ball.x, s.ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.font = 'bold 48px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff5555'; ctx.fillText(s.scores[0], W/4, 64);
      ctx.fillStyle = '#5599ff'; ctx.fillText(s.scores[1], 3*W/4, 64);
    }

    // ⚠ Join a DIFFERENT room than the lobby used, to avoid the
    // "already joined" / dead-room-object problem across page loads.
    let room;
    try {
      room = trysteroJoin({ appId: APP_ID }, roomCode + GAME_SUFFIX);
    } catch (err) {
      statusEl.innerHTML =
        `Failed to join game room: ${err.message}. <a href="lobby.html">Back to lobby</a>`;
      throw err;
    }

    function actionPair(name) {
      const r = room.makeAction(name);
      if (Array.isArray(r)) return [r[0], r[1]];
      if (r && typeof r === 'object') {
        const send = r.send?.bind(r);
        const receive = r.onMessage ? r.onMessage.bind(r) : r.receive?.bind(r);
        if (send && receive) return [send, receive];
      }
      throw new Error(`bad action ${name}`);
    }

    const [sendInput, onInput] = actionPair('input');
    const [sendState, onState] = actionPair('state');

    const state = {
      ball: { x: W/2, y: H/2, vx: 5, vy: 3 },
      paddles: [{ y: H/2 }, { y: H/2 }],
      scores: [0, 0],
    };

    let connected = false;
    let hasState = false;

    function updateConnectionStatus() {
      const peerCount = Object.keys(room.getPeers()).length;
      connected = peerCount > 0;
      if (!connected) {
        statusEl.innerText =
          `Waiting for opponent… (room ${roomCode} · ${role} · ${peerCount} peer${peerCount===1?'':'s'})`;
      } else if (role === 'client' && !hasState) {
        statusEl.innerText = `Connected — waiting for game data…`;
      } else {
        statusEl.innerText = `Playing as ${role} · room ${roomCode}`;
      }
    }
    setInterval(updateConnectionStatus, 500);
    updateConnectionStatus();

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key.startsWith('Arrow')) e.preventDefault();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    if (role === 'host') {
      onInput(data => {
        state.paddles[1].y = clampPaddle(data.y);
      });

      setInterval(() => {
        if (!connected) return;
        if (keys.ArrowUp) state.paddles[0].y -= PADDLE_SPEED;
        if (keys.ArrowDown) state.paddles[0].y += PADDLE_SPEED;
        state.paddles[0].y = clampPaddle(state.paddles[0].y);

        const b = state.ball;
        b.x += b.vx; b.y += b.vy;
        if (b.y - BALL_R < 0) { b.y = BALL_R; b.vy *= -1; }
        if (b.y + BALL_R > H) { b.y = H - BALL_R; b.vy *= -1; }

        const py0 = state.paddles[0].y - PADDLE_H/2;
        if (b.x - BALL_R < 20 + PADDLE_W && b.x + BALL_R > 20
            && b.y + BALL_R > py0 && b.y - BALL_R < py0 + PADDLE_H
            && b.vx < 0) {
          b.vx = Math.abs(b.vx);
          b.x = 20 + PADDLE_W + BALL_R;
        }
        const px1 = W - 20 - PADDLE_W;
        const py1 = state.paddles[1].y - PADDLE_H/2;
        if (b.x + BALL_R > px1 && b.x - BALL_R < px1 + PADDLE_W
            && b.y + BALL_R > py1 && b.y - BALL_R < py1 + PADDLE_H
            && b.vx > 0) {
          b.vx = -Math.abs(b.vx);
          b.x = px1 - BALL_R;
        }
        if (b.x + BALL_R < 0) {
          state.scores[1]++;
          b.x = W/2; b.y = H/2; b.vx = -5; b.vy = 3;
        } else if (b.x - BALL_R > W) {
          state.scores[0]++;
          b.x = W/2; b.y = H/2; b.vx = 5; b.vy = -3;
        }
      }, TICK_MS);

      setInterval(() => {
        if (connected) sendState(state);
      }, 1000 / STATE_HZ);
    }

    else if (role === 'client') {
      onState(data => {
        hasState = true;
        const ownY = state.paddles[1].y;
        state.ball = data.ball;
        state.paddles[0].y = data.paddles[0].y;
        state.paddles[1].y = ownY;
        state.scores = data.scores;
      });

      setInterval(() => {
        if (keys.ArrowUp) state.paddles[1].y -= PADDLE_SPEED;
        if (keys.ArrowDown) state.paddles[1].y += PADDLE_SPEED;
        state.paddles[1].y = clampPaddle(state.paddles[1].y);
        if (connected) sendInput({ y: state.paddles[1].y });
      }, TICK_MS);
    }

    (function loop() {
      draw(state);
      if (!connected) {
        ctx.fillStyle = 'rgba(0,0,0,0.72)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Waiting for opponent…', W/2, H/2);
        ctx.fillStyle = '#aaa';
        ctx.font = '14px monospace';
        ctx.fillText(`room ${roomCode}`, W/2, H/2 + 34);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
