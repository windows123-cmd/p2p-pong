<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>P2P Pong Lobby</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 620px; margin: 40px auto; padding: 20px; }
    button { padding: 10px 18px; margin: 5px 5px 5px 0; font-size: 15px; cursor: pointer;
             border-radius: 6px; border: 1px solid #bbb; background: #f8f8f8; }
    button:hover { background: #eaeaea; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #lobby-view, #search-view, #room-view { display: none; margin-top: 20px; }
    .player-item { padding: 8px; background: #f0f0f0; margin: 4px 0; border-radius: 4px; }
    .room-item { padding: 10px 14px; background: #eef4ff; margin: 6px 0; border-radius: 6px;
                 display: flex; justify-content: space-between; align-items: center; }
    .room-item.full { background: #f8e8e8; opacity: 0.7; }
    #room-code-display { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #0066cc; }
    #status-message { color: #555; margin-top: 10px; }
    .error { color: #c33; }
  </style>
</head>
<body>
  <h1>🎮 P2P Pong Lobby</h1>

  <div id="lobby-view" style="display:block;">
    <button onclick="createRoom()">Create Room</button>
    <button onclick="searchRooms()">Search Open Rooms</button>
    <button onclick="showJoinPrompt()">Join by Code</button>
    <p id="status-message"></p>
  </div>

  <div id="search-view">
    <h3>Open Rooms</h3>
    <div id="search-results"></div>
    <button onclick="searchRooms()">Search Again</button>
    <button onclick="backToLobby()">Back</button>
  </div>

  <div id="room-view">
    <p>Room Code: <span id="room-code-display"></span></p>
    <p>Share this code, or tell friends to use "Search Open Rooms".</p>
    <h3>Players in Room:</h3>
    <ul id="player-list"></ul>
    <button id="start-game-btn" onclick="startGame()" style="display:none;">Start Game</button>
    <p id="room-status"></p>
  </div>

  <script type="module">
    // Trystero's MQTT strategy uses secure wss:// brokers by default.
    import { joinRoom } from 'https://esm.run/trystero/mqtt';

    // -- Configuration -------------------------------------------------
    const APP_ID = 'p2p-pong-windows123-cmd'; // Unique namespace for your game
    const ROOM_CODES = [];
    for (let i = 1; i <= 12; i++) ROOM_CODES.push("PONG-" + String(i).padStart(2, "0"));

    // -- State ----------------------------------------------------------
    let room = null;
    let isHost = false;
    let roomCode = "";
    let connections = [];
    let myName = "Player";

    // -- UI helpers -----------------------------------------------------
    function showView(id) {
      ['lobby-view', 'search-view', 'room-view'].forEach(v => {
        document.getElementById(v).style.display = (v === id) ? 'block' : 'none';
      });
    }
    function backToLobby() { showView('lobby-view'); }

    // -- Create Room ----------------------------------------------------
    function createRoom() {
      isHost = true;
      document.getElementById('status-message').innerText = "Finding an open room slot…";
      tryNextCode(0);
    }

    async function tryNextCode(idx) {
      if (idx >= ROOM_CODES.length) {
        document.getElementById('status-message').innerHTML =
          '<span class="error">All room slots are taken. Try again later.</span>';
        return;
      }
      const code = ROOM_CODES[idx];

      try {
        // Trystero returns a room object synchronously; it handles MQTT connection in the background.
        room = joinRoom({ appId: APP_ID }, code);
        
        // We need to wait a moment to see if the room ID is already in use.
        // Trystero doesn't expose a direct "room full" error, so we use a short delay
        // and check if any peers are already present (which would mean the room is taken).
        await new Promise(r => setTimeout(r, 500));

        // If the room has peers immediately, it's taken.
        if (Object.keys(room.getPeers()).length > 0) {
            room.leave();
            tryNextCode(idx + 1);
            return;
        }

        // Room is free. Set up handlers.
        setupRoomHandlers(code);
        document.getElementById('room-code-display').innerText = code;
        document.getElementById('start-game-btn').style.display = 'block';
        document.getElementById('room-status').innerText = "Waiting for players…";
        document.getElementById('status-message').innerText = "";
        updatePlayerList(["Host (You)"]);
        showView('room-view');

      } catch (err) {
        document.getElementById('status-message').innerHTML =
          `<span class="error">Error: ${err.message}</span>`;
        tryNextCode(idx + 1);
      }
    }

    // -- Room Handlers (Host & Client) ----------------------------------
    function setupRoomHandlers(code) {
      // Action to handle discovery probes
      const [sendProbe, getProbe] = room.makeAction('probe');
      getProbe((data, peerId) => {
        if (data.type === 'probe') {
          sendProbe({ type: 'probe-reply', info: { playerCount: 1, maxPlayers: 2 } }, peerId);
        }
      });

      // Action for joining
      const [sendJoin, getJoin] = room.makeAction('join');
      getJoin((data, peerId) => {
        if (isHost) {
          if (connections.length >= 1) {
            sendJoin({ type: 'room-full' }, peerId);
            return;
          }
          connections.push(peerId);
          sendJoin({ type: 'welcome', name: `Player ${connections.length + 1}` }, peerId);
          broadcast({ type: 'player-joined', name: `Player ${connections.length + 1}` });
          refreshHostPlayerList();
          document.getElementById('room-status').innerText =
            `${connections.length} player(s) connected.`;
        }
      });

      // Action for receiving welcome (client side)
      const [, getWelcome] = room.makeAction('welcome');
      getWelcome((data) => {
        if (!isHost) {
          myName = data.name;
          updatePlayerList([myName]);
          document.getElementById('room-code-display').innerText = code;
          showView('room-view');
        }
      });

      // Action for start game
      const [sendStart, getStart] = room.makeAction('start-game');
      getStart(() => {
        if (!isHost) {
          window.location.href = `index.html?room=${encodeURIComponent(code)}&role=client`;
        }
      });

      // Handle peer join/leave events
      room.onPeerJoin(peerId => {
        if (!isHost) return; // Host handles joins via the 'join' action
        // If a peer joins unexpectedly, we can log it.
        console.log('Peer joined room:', peerId);
      });

      room.onPeerLeave(peerId => {
        if (isHost) {
          connections = connections.filter(id => id !== peerId);
          refreshHostPlayerList();
          document.getElementById('room-status').innerText =
            `${connections.length} player(s) connected.`;
        }
      });
    }

    function refreshHostPlayerList() {
      updatePlayerList(["Host (You)", ...connections.map((_, i) => `Player ${i + 2}`)]);
    }

    // Helper to broadcast via the room (Trystero's send is already broadcast by default)
    function broadcast(msg) {
      // This is a simplified broadcast; actual implementation depends on which action you use.
      // In this example, the host would call sendWelcome or sendPlayerJoined.
    }

    // -- Search Rooms ---------------------------------------------------
    async function searchRooms() {
      showView('search-view');
      const resultsEl = document.getElementById('search-results');
      resultsEl.innerHTML = `<p>Probing ${ROOM_CODES.length} room slots…</p>`;

      const results = await Promise.all(ROOM_CODES.map(code => probeRoom(code)));

      if (results.every(r => r === null)) {
        resultsEl.innerHTML = '<p>No open rooms right now. Create one!</p>';
        return;
      }

      resultsEl.innerHTML = '';
      results.filter(r => r !== null).forEach(room => {
        const full = room.info.playerCount >= room.info.maxPlayers;
        const div = document.createElement('div');
        div.className = 'room-item' + (full ? ' full' : '');
        div.innerHTML = `
          <span><strong>${room.code}</strong> — ${room.info.playerCount}/${room.info.maxPlayers} players${full ? ' (full)' : ''}</span>
          <button ${full ? 'disabled' : ''} onclick="joinRoom('${room.code}')">${full ? 'Full' : 'Join'}</button>
        `;
        resultsEl.appendChild(div);
      });
    }

    function probeRoom(code) {
      return new Promise(resolve => {
        // For probing, we join the room briefly, send a probe, and leave.
        const tempRoom = joinRoom({ appId: APP_ID }, code);
        let done = false;
        const finish = result => {
          if (done) return;
          done = true;
          try { tempRoom.leave(); } catch(e) {}
          resolve(result);
        };
        const timer = setTimeout(() => finish(null), 2500);

        // Wait for the room to be ready, then send probe.
        // Trystero doesn't have an explicit 'ready' event, so we use a short delay.
        setTimeout(() => {
          const [sendProbe, getProbe] = tempRoom.makeAction('probe');
          getProbe((data) => {
            if (data.type === 'probe-reply') {
              clearTimeout(timer);
              finish({ code, info: data.info });
            }
          });
          // Broadcast probe to all peers in the room.
          sendProbe({ type: 'probe' });
        }, 300); // 300ms should be enough for MQTT connection setup.
      });
    }

    // -- Join Room ------------------------------------------------------
    function showJoinPrompt() {
      const code = prompt("Enter the room code (e.g. PONG-03):");
      if (code) joinRoom(code.trim().toUpperCase());
    }

    function joinRoom(code) {
      isHost = false;
      roomCode = code;

      try {
        room = joinRoom({ appId: APP_ID }, code);
        
        // Set up handlers for a client
        setupRoomHandlers(code);

        // Send a join request to the host
        const [sendJoin] = room.makeAction('join');
        // Wait a bit for the room to be ready before sending.
        setTimeout(() => {
          sendJoin({ type: 'join' });
        }, 500);

      } catch (err) {
        document.getElementById('status-message').innerHTML =
          `<span class="error">Join failed: ${err.message}</span>`;
      }
    }

    // -- UI list helpers ------------------------------------------------
    function updatePlayerList(names) {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      names.forEach(n => {
        const li = document.createElement('li');
        li.className = 'player-item';
        li.innerText = n;
        list.appendChild(li);
      });
    }
    function addPlayerToList(name) {
      const li = document.createElement('li');
      li.className = 'player-item';
      li.innerText = name;
      document.getElementById('player-list').appendChild(li);
    }
    function removePlayerFromList(name) {
      document.querySelectorAll('.player-item').forEach(el => {
        if (el.innerText === name) el.remove();
      });
    }

    // -- Start game -----------------------------------------------------
    function startGame() {
      if (!isHost || connections.length === 0) {
        alert("Wait for at least one player to join.");
        return;
      }
      const [, sendStart] = room.makeAction('start-game');
      sendStart(); // Broadcast to all clients
      window.location.href = `index.html?room=${encodeURIComponent(roomCode)}&role=host`;
    }

    // -- Expose functions for HTML onclick handlers ---------------------
    window.createRoom = createRoom;
    window.searchRooms = searchRooms;
    window.showJoinPrompt = showJoinPrompt;
    window.joinRoom = joinRoom;
    window.startGame = startGame;
    window.backToLobby = backToLobby;
  </script>
</body>
</html>
