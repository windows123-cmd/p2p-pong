<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>P2P Pong Lobby</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; }
    #lobby-view, #room-view { display: none; margin-top: 20px; }
    .player-item { padding: 8px; background: #f0f0f0; margin: 4px 0; border-radius: 4px; }
    #room-code-display { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #0066cc; }
    #status-message { color: #555; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🎮 P2P Pong Lobby</h1>

  <!-- Initial view: create or join -->
  <div id="lobby-view" style="display:block;">
    <button onclick="createRoom()">Create Room (Host)</button>
    <button onclick="showJoinPrompt()">Join Room (Client)</button>
    <p id="status-message"></p>
  </div>

  <!-- Room view: share code, see players -->
  <div id="room-view">
    <p>Room Code: <span id="room-code-display"></span></p>
    <p>Share this code with friends. They select "Join Room" and enter it.</p>
    <h3>Players in Room:</h3>
    <ul id="player-list"></ul>
    <button id="start-game-btn" onclick="startGame()" style="display:none;">Start Game</button>
    <p id="room-status"></p>
  </div>

  <script>
    const PREFIX = "p2p-pong-"; // Unique prefix to avoid collisions on the public server
    let peer = null;
    let isHost = false;
    let roomCode = "";
    let connections = []; // Host: all client connections. Client: single connection to host.
    let myName = "Player";

    // --- UTILITIES ---

    function generateRoomCode() {
      // Avoid ambiguous characters (no O/0, I/1) for easy sharing[reference:4]
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < 5; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    function showRoomView(code) {
      document.getElementById('lobby-view').style.display = 'none';
      document.getElementById('room-view').style.display = 'block';
      document.getElementById('room-code-display').innerText = code;
    }

    function updatePlayerList(names) {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      names.forEach(name => {
        const li = document.createElement('li');
        li.className = 'player-item';
        li.innerText = name;
        list.appendChild(li);
      });
    }

    // --- HOST LOGIC ---

    function createRoom() {
      isHost = true;
      roomCode = generateRoomCode();
      const fullPeerId = PREFIX + roomCode;

      peer = new Peer(fullPeerId);

      peer.on('open', (id) => {
        document.getElementById('status-message').innerText = "Room created!";
        showRoomView(roomCode);
        document.getElementById('start-game-btn').style.display = 'block';
        document.getElementById('room-status').innerText = "Waiting for players to join...";
        updatePlayerList(["Host (You)"]);
      });

      peer.on('error', (err) => {
        document.getElementById('status-message').innerText = "Error: " + err.type;
      });

      // A new client is trying to connect
      peer.on('connection', (conn) => {
        connections.push(conn);
        const playerName = `Player ${connections.length + 1}`;

        conn.on('open', () => {
          // Tell the new client their assigned name
          conn.send({ type: 'welcome', name: playerName });
          // Tell everyone else about the new player
          broadcast({ type: 'player-joined', name: playerName });
          refreshHostPlayerList();
          document.getElementById('room-status').innerText =
            `${connections.length} player(s) connected.`;
        });

        conn.on('data', (data) => {
          // Clients might send a ready signal or their own name
          if (data.type === 'join') {
            conn.send({ type: 'welcome', name: playerName });
          }
        });

        conn.on('close', () => {
          connections = connections.filter(c => c !== conn);
          broadcast({ type: 'player-left', name: playerName });
          refreshHostPlayerList();
          document.getElementById('room-status').innerText =
            `${connections.length} player(s) connected.`;
        });
      });
    }

    function refreshHostPlayerList() {
      const names = ["Host (You)", ...connections.map((_, i) => `Player ${i + 2}`)];
      updatePlayerList(names);
    }

    function broadcast(message) {
      connections.forEach(conn => {
        if (conn.open) conn.send(message);
      });
    }

    // --- CLIENT LOGIC ---

    function showJoinPrompt() {
      const code = prompt("Enter the 5-character Room Code:");
      if (!code) return;
      joinRoom(code.trim().toUpperCase());
    }

    function joinRoom(code) {
      isHost = false;
      roomCode = code;
      const fullPeerId = PREFIX + roomCode;

      peer = new Peer(); // Random ID for the client

      peer.on('open', () => {
        const conn = peer.connect(fullPeerId);
        connections.push(conn); // Client keeps only this one connection

        conn.on('open', () => {
          document.getElementById('status-message').innerText = "Connected!";
          showRoomView(code);
          conn.send({ type: 'join' });
        });

        conn.on('data', (data) => {
          if (data.type === 'welcome') {
            myName = data.name;
            updatePlayerList([myName]);
          }
          if (data.type === 'player-joined') {
            // Client receives the new player's name and adds it
            const list = document.getElementById('player-list');
            const li = document.createElement('li');
            li.className = 'player-item';
            li.innerText = data.name;
            list.appendChild(li);
          }
          if (data.type === 'player-left') {
            // Remove the player from the list (simplified)
            const items = document.querySelectorAll('.player-item');
            items.forEach(item => {
              if (item.innerText === data.name) item.remove();
            });
          }
          if (data.type === 'start-game') {
            // This is where the handoff to the game happens
            window.location.href = `index.html?room=${roomCode}&role=client&name=${encodeURIComponent(myName)}`;
          }
        });

        conn.on('error', (err) => {
          document.getElementById('status-message').innerText = "Connection error: " + err;
        });
      });
    }

    // --- START GAME ---

    function startGame() {
      if (!isHost || connections.length === 0) {
        alert("Wait for at least one player to join.");
        return;
      }
      // Tell all clients to go to the game page
      broadcast({ type: 'start-game' });
      // Host also goes to the game page
      window.location.href = `index.html?room=${roomCode}&role=host`;
    }
  </script>
</body>
</html>
