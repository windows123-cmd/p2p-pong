<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>P2P Pong Lobby</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 620px; margin: 40px auto; padding: 20px; }
    button { padding: 10px 18px; margin: 5px 5px 5px 0; font-size: 15px; cursor: pointer;
             border-radius: 6px; border: 1px solid #bbb; background: #f8f8f8; }
    button:hover { background: #eaeaea; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #lobby-view, #search-view, #room-view { display: none; margin-top: 20px; }
    .player-item { padding: 8px; background: #f0f0f0; margin: 4px 0; border-radius: 4px; }
    .room-item { padding: 10px 14px; background: #eef4ff; margin: 6px 0; border-radius: 6px;
                 display: flex; justify-content: space-between; align-items: center; }
    .room-item.full { background: #f8e8e8; opacity: 0.7; }
    .room-item.own { background: #eef0ff; border: 1px solid #99aaff; }
    #room-code-display { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #0066cc; }
    #status-message { color: #555; margin-top: 10px; }
    .error { color: #c33; }
  </style>
</head>
<body>
  <h1>🎮 P2P Pong Lobby</h1>

  <div id="lobby-view" style="display:block;">
    <button onclick="createRoom()">Create Room</button>
    <button onclick="searchRooms()">Search Open Rooms</button>
    <button onclick="showJoinPrompt()">Join by Code</button>
    <p id="status-message"></p>
  </div>

  <div id="search-view">
    <h3>Open Rooms</h3>
    <div id="search-results"></div>
    <button onclick="searchRooms()">Search Again</button>
    <button onclick="backToLobby()">Back</button>
  </div>

  <div id="room-view">
    <p>Room Code: <span id="room-code-display"></span></p>
    <p>Share this code, or tell friends to use "Search Open Rooms".</p>
    <h3>Players in Room:</h3>
    <ul id="player-list"></ul>
    <button id="start-game-btn" onclick="startGame()" style="display:none;">Start Game</button>
    <p id="room-status"></p>
  </div>

  <script type="module">
    import { joinRoom as trysteroJoin } from 'https://esm.run/@trystero-p2p/mqtt';

    // -- Configuration -------------------------------------------------
    const APP_ID = 'p2p-pong-windows123-cmd';
    const ROOM_CODES = [];
    for (let i = 1; i <= 12; i++) ROOM_CODES.push("PONG-" + String(i).padStart(2, "0"));

    // Discovery timing — MQTT peer discovery usually lands within 2-4s
    const CLAIM_DISCOVERY_WAIT_MS = 4000;  // wait before claiming a slot
    const PROBE_DISCOVERY_WAIT_MS = 3500;  // wait before listing a room
    const PROBE_TIMEOUT_MS = 5000;

    // -- State ---------------------------------------------------------
    let room = null;
    let isHost = false;
    let roomCode = "";
    let connections = [];
    let myName = "Player";
    let sendJoinFn = null;
    let sendStartFn = null;
    let joinTimeout = null;
    let busy = false;  // prevent double-clicks

    // -- UI helpers ----------------------------------------------------
    function showView(id) {
      ['lobby-view', 'search-view', 'room-view'].forEach(v => {
        document.getElementById(v).style.display = (v === id) ? 'block' : 'none';
      });
    }
    function backToLobby() { showView('lobby-view'); }

    // -- Create Room ---------------------------------------------------
    function createRoom() {
      if (busy) return;
      busy = true;
      isHost = true;
      document.getElementById('status-message').innerText = "Finding an open room slot…";
      tryNextCode(0).finally(() => { busy = false; });
    }

    async function tryNextCode(idx) {
      if (idx >= ROOM_CODES.length) {
        document.getElementById('status-message').innerHTML =
          '<span class="error">All room slots are taken. Try again later.</span>';
        return;
      }
      const code = ROOM_CODES[idx];
      let tempRoom = null;

      try {
        tempRoom = trysteroJoin({ appId: APP_ID }, code);

        // Wait for peer discovery before claiming the slot
        await new Promise(r => setTimeout(r, CLAIM_DISCOVERY_WAIT_MS));

        const peers = Object.keys(tempRoom.getPeers());
        if (peers.length > 0) {
          // Someone else is already in this slot — leave and try next
          try { tempRoom.leave(); } catch(e) {}
          return tryNextCode(idx + 1);
        }

        // Slot is free — claim it
        room = tempRoom;
        roomCode = code;
        setupRoomHandlers();
        document.getElementById('room-code-display').innerText = code;
        document.getElementById('start-game-btn').style.display = 'block';
        document.getElementById('room-status').innerText = "Waiting for players…";
        document.getElementById('status-message').innerText = "";
        updatePlayerList(["Host (You)"]);
        showView('room-view');
      } catch (err) {
        try { if (tempRoom) tempRoom.leave(); } catch(e) {}
        document.getElementById('status-message').innerHTML =
          `<span class="error">Slot ${code}: ${err.message || err}</span>`;
        return tryNextCode(idx + 1);
      }
    }

    // -- Normalise makeAction return shape (array or object) -----------
    function actionPair(name) {
      const result = room.makeAction(name);
      if (Array.isArray(result)) return [result[0], result[1]];
      if (result && typeof result === 'object') {
        const send = result.send?.bind(result);
        const receive = result.onMessage
          ? result.onMessage.bind(result)
          : result.receive?.bind(result);
        if (send && receive) return [send, receive];
      }
      throw new Error(`Unsupported makeAction("${name}") shape`);
    }

    // -- Shared room handlers (host + client) --------------------------
    function setupRoomHandlers() {
      const [, onProbe]              = actionPair('probe');
      const [sendProbeReply]         = actionPair('probe-reply');
      const [sendJoin, onJoin]       = actionPair('join');
      const [sendWelcome, onWelcome] = actionPair('welcome');
      const [sendStart, onStart]     = actionPair('start');

      sendJoinFn = sendJoin;
      sendStartFn = sendStart;

      onProbe((data, peerId) => {
        if (!isHost) return;
        sendProbeReply(
          { info: { playerCount: connections.length, maxPlayers: 2 } },
          peerId
        );
      });

      onJoin((data, peerId) => {
        if (!isHost) return;
        if (connections.length >= 1 && !connections.includes(peerId)) {
          sendWelcome({ type: 'room-full' }, peerId);
          return;
        }
        if (!connections.includes(peerId)) connections.push(peerId);
        const name = `Player ${connections.length + 1}`;
        sendWelcome({ type: 'welcome', name }, peerId);
        refreshHostPlayerList();
        document.getElementById('room-status').innerText =
          `${connections.length} player(s) connected.`;
      });

      onWelcome(data => {
        if (isHost) return;
        if (data.type === 'welcome') {
          if (joinTimeout) { clearTimeout(joinTimeout); joinTimeout = null; }
          myName = data.name;
          updatePlayerList([myName]);
          document.getElementById('room-code-display').innerText = roomCode;
          document.getElementById('room-status').innerText = "Connected.";
          showView('room-view');
        } else if (data.type === 'room-full') {
          if (joinTimeout) { clearTimeout(joinTimeout); joinTimeout = null; }
          document.getElementById('status-message').innerHTML =
            '<span class="error">That room is full.</span>';
          try { room.leave(); } catch(e) {}
          room = null;
          backToLobby();
        }
      });

      onStart(() => {
        if (!isHost) {
          window.location.href =
            `index.html?room=${encodeURIComponent(roomCode)}&role=client`;
        }
      });

      room.onPeerLeave(peerId => {
        if (isHost) {
          connections = connections.filter(id => id !== peerId);
          refreshHostPlayerList();
          document.getElementById('room-status').innerText =
            `${connections.length} player(s) connected.`;
        } else {
          document.getElementById('room-status').innerText = "Host disconnected.";
        }
      });
    }

    function refreshHostPlayerList() {
      updatePlayerList(["Host (You)", ...connections.map((_, i) => `Player ${i + 2}`)]);
    }

    // -- Search rooms --------------------------------------------------
    async function searchRooms() {
      if (busy) return;
      busy = true;
      showView('search-view');
      const resultsEl = document.getElementById('search-results');
      resultsEl.innerHTML = `<p>Probing ${ROOM_CODES.length} room slots…</p>`;

      const results = [];
      const BATCH = 4;
      for (let i = 0; i < ROOM_CODES.length; i += BATCH) {
        const batch = ROOM_CODES.slice(i, i + BATCH);
        const batchResults = await Promise.all(batch.map(code => {
          // Skip our own room — mark it as "(your room)" instead of probing it
          if (room && code === roomCode) {
            return Promise.resolve({
              code,
              info: {
                playerCount: connections.length + 1,
                maxPlayers: 2,
                isOwn: true
              }
            });
          }
          return probeRoom(code);
        }));
        results.push(...batchResults);
        resultsEl.innerHTML =
          `<p>Probing ${Math.min(i + BATCH, ROOM_CODES.length)}/${ROOM_CODES.length}…</p>`;
      }

      const found = results.filter(r => r !== null);
      if (found.length === 0) {
        resultsEl.innerHTML = '<p>No open rooms right now. Create one!</p>';
        busy = false;
        return;
      }

      resultsEl.innerHTML = '';
      found.forEach(r => {
        const full = r.info.playerCount >= r.info.maxPlayers;
        const cls = 'room-item' + (full ? ' full' : '') + (r.info.isOwn ? ' own' : '');
        const label = r.info.isOwn
          ? `(your room) — ${r.info.playerCount}/${r.info.maxPlayers}`
          : `${r.info.playerCount}/${r.info.maxPlayers} players${full ? ' (full)' : ''}`;
        const btn = r.info.isOwn
          ? '<button disabled>Your room</button>'
          : `<button ${full ? 'disabled' : ''} onclick="joinRoom('${r.code}')">${full ? 'Full' : 'Join'}</button>`;
        const div = document.createElement('div');
        div.className = cls;
        div.innerHTML = `<span><strong>${r.code}</strong> — ${label}</span>${btn}`;
        resultsEl.appendChild(div);
      });
      busy = false;
    }

    function probeRoom(code) {
      return new Promise(resolve => {
        let tempRoom;
        try {
          tempRoom = trysteroJoin({ appId: APP_ID }, code);
        } catch (err) {
          // "already joined" or any other sync error — treat as unavailable
          resolve(null);
          return;
        }

        let done = false;
        const finish = result => {
          if (done) return;
          done = true;
          try { tempRoom.leave(); } catch(e) {}
          resolve(result);
        };

        const timer = setTimeout(() => finish(null), PROBE_TIMEOUT_MS);

        setTimeout(() => {
          const peers = Object.keys(tempRoom.getPeers());
          clearTimeout(timer);
          if (peers.length > 0) {
            finish({ code, info: { playerCount: peers.length, maxPlayers: 2 } });
          } else {
            finish(null);
          }
        }, PROBE_DISCOVERY_WAIT_MS);
      });
    }

    // -- Join Room -----------------------------------------------------
    function showJoinPrompt() {
      const code = prompt("Enter the room code (e.g. PONG-03):");
      if (code) joinRoom(code.trim().toUpperCase());
    }

    function joinRoom(code) {
      if (busy) return;
      busy = true;
      isHost = false;
      roomCode = code;

      try {
        room = trysteroJoin({ appId: APP_ID }, code);
        setupRoomHandlers();

        setTimeout(() => {
          if (sendJoinFn) sendJoinFn({ type: 'join' });
        }, 800);

        joinTimeout = setTimeout(() => {
          if (document.getElementById('room-view').style.display !== 'block') {
            document.getElementById('status-message').innerHTML =
              '<span class="error">Room not found or host unreachable.</span>';
            try { room.leave(); } catch(e) {}
            room = null;
            backToLobby();
          }
          busy = false;
        }, 8000);
      } catch (err) {
        document.getElementById('status-message').innerHTML =
          `<span class="error">Join failed: ${err.message || err}</span>`;
        busy = false;
      }
    }

    // -- UI list helpers -----------------------------------------------
    function updatePlayerList(names) {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      names.forEach(n => {
        const li = document.createElement('li');
        li.className = 'player-item';
        li.innerText = n;
        list.appendChild(li);
      });
    }

    // -- Start game ----------------------------------------------------
    function startGame() {
      if (!isHost || connections.length === 0) {
        alert("Wait for at least one player to join.");
        return;
      }
      if (sendStartFn) sendStartFn();
      setTimeout(() => {
        window.location.href =
          `index.html?room=${encodeURIComponent(roomCode)}&role=host`;
      }, 500);
    }

    // -- Expose for HTML onclick ---------------------------------------
    window.createRoom = createRoom;
    window.searchRooms = searchRooms;
    window.showJoinPrompt = showJoinPrompt;
    window.joinRoom = joinRoom;
    window.startGame = startGame;
    window.backToLobby = backToLobby;
  </script>
</body>
</html>
